# Fan fork only: publishes the in-story archive to GitHub Pages at
# https://tissadelleshepherd.github.io/tissadelle-shepherd-photography/
# on every push to main. Needs Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - name: Build under the Pages sub-path
        run: npx eleventy --pathprefix=/tissadelle-shepherd-photography/
        env:
          SITE_DOMAIN: tissadelleshepherd.github.io/tissadelle-shepherd-photography
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
